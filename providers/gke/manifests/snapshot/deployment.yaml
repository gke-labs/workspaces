apiVersion: apps/v1
kind: Deployment
metadata:
  name: gke-workspace-snapshot-addon
  labels:
    app: gke-workspace-snapshot-addon
spec:
  # Two replicas keep the mutating webhooks available across node drains and
  # rollouts. Only the replica holding the gke-workspace-snapshot-addon Lease
  # reconciles, so there is never duplicated work against the GKE PodSnapshot API.
  replicas: 2
  selector:
    matchLabels:
      app: gke-workspace-snapshot-addon
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: gke-workspace-snapshot-addon
    spec:
      serviceAccountName: gke-workspace-snapshot-addon
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: gke-workspace-snapshot-addon
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: addon
          image: gke-workspace-snapshot-addon:unconfigured
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: gke-workspace-snapshot-addon
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: webhook
              containerPort: 9443
            - name: health
              containerPort: 8080
          volumeMounts:
            - name: webhook-cert
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: webhook-cert
          secret:
            secretName: gke-snapshot-webhook-cert
            optional: true
