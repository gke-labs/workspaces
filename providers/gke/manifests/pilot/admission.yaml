apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: notebooks-gke-pilot-workspaces
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: team-a
    resourceRules:
      - apiGroups: [kubeflow.org]
        apiVersions: [v1beta1]
        operations: [CREATE, UPDATE]
        resources: [workspaces]
  validations:
    - expression: object.spec.kind in ['gke-jupyterlab', 'jupyterlab', 'jupyterlab-resumable']
      message: The pilot permits only the reviewed gke-jupyterlab, jupyterlab, or jupyterlab-resumable WorkspaceKind.
    - expression: "!has(object.spec.podTemplate.volumes.secrets) || size(object.spec.podTemplate.volumes.secrets) == 0"
      message: Secret mounts are disabled for the pilot.
    - expression: "!has(object.spec.podTemplate.podMetadata) || ((!has(object.spec.podTemplate.podMetadata.labels) || size(object.spec.podTemplate.podMetadata.labels) == 0) && (!has(object.spec.podTemplate.podMetadata.annotations) || size(object.spec.podTemplate.podMetadata.annotations) == 0))"
      message: User-supplied pod labels and annotations are disabled for the pilot.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: notebooks-gke-pilot-workspaces
spec:
  policyName: notebooks-gke-pilot-workspaces
  validationActions: [Deny]