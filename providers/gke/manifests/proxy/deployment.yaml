apiVersion: apps/v1
kind: Deployment
metadata:
  name: gke-access-proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gke-access-proxy
  template:
    metadata:
      labels:
        app: gke-access-proxy
    spec:
      serviceAccountName: gke-access-proxy
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proxy
          image: gke-access-proxy:unconfigured
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: gke-access-proxy
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
