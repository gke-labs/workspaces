# WorkspaceKind manifest for jupyterlab-resumable.
#
# Before applying this manifest to your cluster, set the image path placeholders:
#   <YOUR_CPU_IMAGE>: upstream "ghcr.io/kubeflow/kubeflow/notebook-servers/jupyter-scipy:v1.11.0"
#                     or custom "us-central1-docker.pkg.dev/<PROJECT_ID>/<REPO>/jupyterlab:latest-cpu"
#   <YOUR_GPU_IMAGE>: upstream "ghcr.io/kubeflow/kubeflow/notebook-servers/jupyter-pytorch-cuda-full:v1.11.0"
#                     or custom "us-central1-docker.pkg.dev/<PROJECT_ID>/<REPO>/jupyterlab:latest-gpu"
#   <YOUR_GCS_BUCKET>: e.g. "<PROJECT_ID>-<TENANT_NAMESPACE>-bucket" (shared GCS bucket for workspace data)
#
# You can edit the placeholders directly in this file, or apply with sed (run from
# the repository root):
#   sed -e "s|<YOUR_CPU_IMAGE>|${CPU_IMAGE}|g" \
#       -e "s|<YOUR_GPU_IMAGE>|${GPU_IMAGE}|g" \
#       -e "s|<YOUR_GCS_BUCKET>|${GCS_BUCKET}|g" \
#       examples/resumable-notebooks/manifests/workspacekind-resumable.yaml | kubectl apply -f -
apiVersion: kubeflow.org/v1beta1
kind: WorkspaceKind
metadata:
  name: jupyterlab-resumable
  annotations:
    # enable pod snapshot and resume for all workspaces (all CPU and GPU podconfigs are resumable)
    podsnapshot.gke.kubeflow.org/enabled: "true"
    podsnapshot.gke.kubeflow.org/storage-config: "kubeflow-pod-snapshot-storage-config"
spec:
  spawner:
    displayName: "JupyterLab Notebook (Resumable)"
    description: "A Workspace which runs JupyterLab in a Pod with stateful pause and resume support"
    icon:
      url: "https://jupyter.org/assets/favicons/apple-touch-icon-152x152.png"
    logo:
      url: "https://upload.wikimedia.org/wikipedia/commons/3/38/Jupyter_logo.svg"

  filterRules:
    # --------------------------------------------------------------------------
    # IMAGE_CONFIG scope: Filter images based on selected PodConfig accelerator
    # --------------------------------------------------------------------------
    # When a CPU pod is selected, hide GPU images
    - scope: IMAGE_CONFIG
      effect:
        ui:
          hide: true
        api:
          deny: true
          denyMessage:
            text: "This image requires an accelerator (GPU) pod, but a CPU pod was selected."
      match:
        - matchPodConfig:
            selector:
              matchLabels:
                accelerator: cpu
        - matchImageConfig:
            selector:
              matchExpressions:
                - key: accelerator
                  operator: NotIn
                  values: ["cpu"]

    # When a GPU pod is selected, hide non-GPU images
    - scope: IMAGE_CONFIG
      effect:
        ui:
          hide: true
        api:
          deny: true
          denyMessage:
            text: "This image is not built for CUDA GPUs; please select a GPU-enabled image."
      match:
        - matchPodConfig:
            selector:
              matchLabels:
                accelerator: gpu
        - matchImageConfig:
            selector:
              matchExpressions:
                - key: accelerator
                  operator: NotIn
                  values: ["gpu"]

    # --------------------------------------------------------------------------
    # POD_CONFIG scope: Filter podConfigs based on selected ImageConfig accelerator
    # --------------------------------------------------------------------------
    # When a CPU image is selected, hide GPU pod configs
    - scope: POD_CONFIG
      effect:
        ui:
          hide: true
        api:
          deny: true
          denyMessage:
            text: "A CPU image cannot be scheduled on an accelerator (GPU) pod."
      match:
        - matchImageConfig:
            selector:
              matchLabels:
                accelerator: cpu
        - matchPodConfig:
            selector:
              matchExpressions:
                - key: accelerator
                  operator: NotIn
                  values: ["cpu"]

    # When a GPU image is selected, hide non-GPU pod configs
    - scope: POD_CONFIG
      effect:
        ui:
          hide: true
        api:
          deny: true
          denyMessage:
            text: "A GPU image requires a GPU pod."
      match:
        - matchImageConfig:
            selector:
              matchLabels:
                accelerator: gpu
        - matchPodConfig:
            selector:
              matchExpressions:
                - key: accelerator
                  operator: NotIn
                  values: ["gpu"]

  activityRules:
    - config:
        secondsSinceActive: 14400 # auto pauses the notebook after 4h of inactivity
      match: {}
      effect:
        pauseWorkspace: true

  podTemplate:
    podMetadata:
      labels: {}
      annotations: {}
    serviceAccount:
      clusterRoles:
        - name: "kubeflow-edit"
    activityProbe:
      minProbeIntervalSeconds: 100
      probeIntervalSeconds: 300
      jupyter:
        lastActivity: true
        portId: "jupyterlab"
    probes:
      startupProbe:
        tcpSocket:
          port: 8888
        periodSeconds: 5
        failureThreshold: 60
      readinessProbe:
        tcpSocket:
          port: 8888
        periodSeconds: 5
    volumeMounts:
      home: "/home/jovyan"
    ports:
      - id: "jupyterlab"
        defaultDisplayName: "JupyterLab"
        protocol: "HTTP"
        httpProxy:
          removePathPrefix: false
          requestHeaders: {}
    extraEnv:
      - name: "NB_PREFIX"
        value: |-
          {{ httpPathPrefix "jupyterlab" }}
      - name: "JUPYTERHUB_SERVICE_PREFIX"
        value: |-
          {{ httpPathPrefix "jupyterlab" }}
      - name: "LD_LIBRARY_PATH"
        value: "/usr/local/nvidia/lib64"
      - name: "PATH"
        value: "/home/jovyan/.local/bin:/usr/local/nvidia/bin:/usr/local/cuda/bin:/opt/conda/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      # Shared GCS bucket exposed to notebooks as $GCS_BUCKET.
      - name: "GCS_BUCKET"
        value: "<YOUR_GCS_BUCKET>"
    extraVolumeMounts:
      - name: "dshm"
        mountPath: "/dev/shm"
    extraVolumes:
      - name: "dshm"
        emptyDir:
          medium: "Memory"
    securityContext:
      fsGroup: 100
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    options:
      imageConfig:
        spawner:
          default: "jupyterlab-cpu"
        values:
          - id: "jupyterlab-cpu"
            spawner:
              displayName: "jupyterlab (CPU)"
              # Generic on purpose: <YOUR_CPU_IMAGE> may be the upstream base image or
              # the custom image from images/build.sh, whose package sets differ.
              description: "JupyterLab (CPU image)"
              labels:
                - key: "accelerator"
                  value: "cpu"
            spec:
              image: "<YOUR_CPU_IMAGE>"
              imagePullPolicy: "IfNotPresent"
              ports:
                - id: "jupyterlab"
                  port: 8888
          - id: "jupyterlab-gpu"
            spawner:
              displayName: "jupyterlab (GPU)"
              # Generic on purpose: <YOUR_GPU_IMAGE> may be the upstream
              # jupyter-pytorch-cuda-full base image or the custom GPU image.
              description: "JupyterLab with PyTorch and CUDA (GPU image)"
              labels:
                - key: "accelerator"
                  value: "gpu"
            spec:
              image: "<YOUR_GPU_IMAGE>"
              imagePullPolicy: "IfNotPresent"
              ports:
                - id: "jupyterlab"
                  port: 8888
          - id: "jupyter-scipy:v1.10.0"
            spawner:
              displayName: "jupyter-scipy:v1.10.0 (Upstream)"
              description: "Upstream JupyterLab with SciPy Packages"
              labels:
                - key: "python_version"
                  value: "3.12.9"
                - key: "accelerator"
                  value: "cpu"
            spec:
              image: "ghcr.io/kubeflow/kubeflow/notebook-servers/jupyter-scipy:v1.10.0"
              imagePullPolicy: "IfNotPresent"
              ports:
                - id: "jupyterlab"
                  port: 8888
      podConfig:
        spawner:
          default: "small_cpu"
        values:
          - id: "tiny_cpu"
            spawner:
              displayName: "Tiny CPU"
              description: "Pod with 0.1 CPU, 128 Mb RAM"
              labels:
                - key: "accelerator"
                  value: "cpu"
                - key: "cpu"
                  value: "100m"
                - key: "memory"
                  value: "128Mi"
            spec:
              affinity: {}
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
          - id: "medium_cpu"
            spawner:
              displayName: "Medium CPU"
              description: "Pod with 2 CPU, 4 GB RAM"
              labels:
                - key: "accelerator"
                  value: "cpu"
                - key: "cpu"
                  value: "2"
                - key: "memory"
                  value: "4Gi"
            spec:
              resources:
                requests:
                  cpu: 2
                  memory: 4Gi
                limits:
                  cpu: 2
                  memory: 4Gi
          - id: "small_cpu"
            spawner:
              displayName: "Small CPU"
              description: "Pod with 1 CPU, 4 GB RAM"
              labels:
                - key: "accelerator"
                  value: "cpu"
                - key: "cpu"
                  value: "1000m"
                - key: "memory"
                  value: "4Gi"
            spec:
              resources:
                requests:
                  cpu: 1000m
                  memory: 2Gi
                limits:
                  cpu: 2000m
                  memory: 4Gi
          - id: "gpu_t4_spot"
            spawner:
              displayName: "GPU T4 Spot"
              description: "Pod with 1 T4 GPU (16 GB VRAM), 12 CPU, 40 GB RAM"
              labels:
                - key: "accelerator"
                  value: "gpu"
                - key: "cpu"
                  value: "12"
                - key: "memory"
                  value: "40Gi"
            spec:
              nodeSelector:
                # T4 only (not gpu-best-available): a GPU snapshot can only be restored
                # onto the same GPU model it was taken on, so pause/resume must never
                # switch between T4 and L4.
                cloud.google.com/compute-class: "gpu-t4-spot"
              # Sized to land on n1-standard-16 (16 vCPU / 60 GB, ~51 GiB allocatable),
              # the T4-capable N1 shape. The generous memory is not just for the model:
              # GKE copies GPU state through the pod's process memory while taking and
              # restoring a PodSnapshot, so peak pod memory during a pause exceeds what
              # the workload uses at rest.
              resources:
                requests:
                  cpu: 12
                  memory: 40Gi
                limits:
                  cpu: 12
                  memory: 40Gi
                  nvidia.com/gpu: 1
