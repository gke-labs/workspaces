apiVersion: apps/v1
kind: Deployment
metadata:
  name: fashion-mnist-inference
  labels:
    app: fashion-mnist-inference
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fashion-mnist-inference
  template:
    metadata:
      labels:
        app: fashion-mnist-inference
    spec:
      # Complies with the PodSecurity "restricted" profile. The tenant namespace
      # only *enforces* "baseline", but it *warns* on "restricted" -- without this
      # block every `kubectl apply` prints four PodSecurity warnings.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: inference
        image: python:3.12-slim
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        # Running as UID 1000 means pip cannot write to the image's system
        # site-packages, so install into the writable `pylibs` emptyDir below and
        # point PYTHONPATH at it. (serve.py also stages params.npz in /tmp, which
        # is mounted as an emptyDir for the same reason.)
        command:
        - /bin/sh
        - -c
        - pip install --no-cache-dir --quiet --target /pylibs numpy google-cloud-storage && PYTHONPATH=/pylibs python3 /app/serve.py
        env:
        - name: BUCKET_NAME
          value: "BUCKET_NAME_PLACEHOLDER"
        - name: PORT
          value: "8080"
        - name: HOME
          value: /tmp
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /livez
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: serve-code
          mountPath: /app
        - name: pylibs
          mountPath: /pylibs
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: serve-code
        configMap:
          name: ml-demo-serve-code
      - name: pylibs
        emptyDir: {}
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: fashion-mnist-inference
  labels:
    app: fashion-mnist-inference
spec:
  selector:
    app: fashion-mnist-inference
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
