# Agent Substrate installation document, rendered with envsubst by
# deploy_agent_substrate.sh and passed to `ate-setup deploy ate-system --config`.
# See docs/operator-install.md in the Substrate repository for every setting.
apiVersion: install.ate.dev/v1alpha1
kind: SubstrateInstall

namespace: ate-system
context: ${CONTEXT}

ko:
  dockerRepo: ${KO_DOCKER_REPO}
  defaultPlatforms: ${KO_DEFAULTPLATFORMS}

# Actor snapshots (suspend/resume) are written here.
storage:
  bucketName: ${ATE_SNAPSHOT_BUCKET}

gcp:
  projectID: ${PROJECT_ID}
  clusterName: ${CLUSTER_NAME}
  clusterLocation: ${LOCATION}

atenet:
  dataplane: envoy
