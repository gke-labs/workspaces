# Warm capacity for the agents. Substrate packs many actors (AX Tasks) onto
# these worker pods and moves them between pods on suspend/resume; no new Pod
# is scheduled when an agent wakes up.
#
# The workers run gVisor (runsc) themselves inside unprivileged pods, so they
# must NOT land on GKE Sandbox (gVisor) nodes; the nodeSelector pins them to
# the dedicated node pool deploy_agent_substrate.sh creates.
apiVersion: v1
kind: Namespace
metadata:
  name: ${WORKER_NAMESPACE}
---
apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  name: ax-agents
  namespace: ${WORKER_NAMESPACE}
  labels:
    workload: ax-agents
spec:
  replicas: ${WORKER_REPLICAS}
  workerImage: ${WORKER_IMAGE}
  sandboxClasses:
  - name: gvisor
  template:
    nodeSelector:
      cloud.google.com/gke-nodepool: ${SUBSTRATE_NODE_POOL}
    # Per-worker capacity: the limits are what Substrate packs actors into.
    resources:
      limits:
        cpu: "${WORKER_CPU}"
        memory: ${WORKER_MEMORY}
      requests:
        cpu: 500m
        memory: ${WORKER_MEMORY}
