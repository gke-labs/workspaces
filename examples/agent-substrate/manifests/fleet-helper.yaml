# fleet-helper: default egress policies + a read-only actor view for the
# tenant atespaces listed in --atespaces. See ../fleet-helper/main.go.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fleet-helper
  namespace: ax-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fleet-helper-egress-policy
  namespace: ax-system
data:
  # Applied to every actor in a managed atespace that has no EgressPolicy yet
  # (Substrate denies all actor egress until one exists). Same shape as
  # `kubectl ate create egress-policy -f`. TLS passthrough: the gateway checks
  # the server name and forwards the encrypted stream; it does not decrypt it.
  egress-policy.yaml: |
    rules:
    - tlsPassthrough:
        hostnames: ${EGRESS_HOSTNAMES}
        ports:
          numbers: [443]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-helper
  namespace: ax-system
  labels:
    app.kubernetes.io/name: fleet-helper
    app.kubernetes.io/part-of: ax
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fleet-helper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleet-helper
      annotations:
        # Roll the pod when the policy changes; it is read once at startup.
        egress-policy/hostnames: '${EGRESS_HOSTNAMES}'
    spec:
      serviceAccountName: fleet-helper
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: fleet-helper
        image: ${FLEET_HELPER_IMAGE}
        args:
        - --atespaces=${TENANT_NAMESPACE}
        - --egress-policy-file=/etc/fleet-helper/egress-policy.yaml
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 500m, memory: 256Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
        - {name: policy, mountPath: /etc/fleet-helper, readOnly: true}
        - {name: ate-token, mountPath: /var/run/secrets/ateapi, readOnly: true}
        - {name: servicedns-ca, mountPath: /run/servicedns-ca, readOnly: true}
      volumes:
      - name: policy
        configMap:
          name: fleet-helper-egress-policy
      # The same credentials ax-server uses: a ServiceAccount token for the
      # ate-api audience, and the CA bundle that signs ate-api's certificate.
      - name: ate-token
        projected:
          sources:
          - serviceAccountToken:
              audience: api.ate-system.svc
              expirationSeconds: 7200
              path: token
      - name: servicedns-ca
        projected:
          sources:
          - clusterTrustBundle:
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
              signerName: servicedns.podcert.ate.dev/identity
---
apiVersion: v1
kind: Service
metadata:
  name: fleet-helper
  namespace: ax-system
  labels:
    app.kubernetes.io/name: fleet-helper
spec:
  selector:
    app.kubernetes.io/name: fleet-helper
  ports:
  - port: 8080
    targetPort: 8080
    name: http
