version: 2

updates:
  - package-ecosystem: "gomod"
    directory: "/providers/gke"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
    ignore:
      # Kubernetes upgrades are expected to be breaking changes and should be handled manually
      - dependency-name: "k8s.io/*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "sigs.k8s.io/*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    groups:
      k8s-packages:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
