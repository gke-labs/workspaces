name: GKE Provider Tests

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - gke
  pull_request:
    branches:
      - main
      - gke

jobs:
  test:
    name: Run tests in providers/gke/Makefile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: providers/gke/go.mod
          cache-dependency-path: providers/gke/go.sum

      - name: Run tests
        run: make -C providers/gke test

      - name: Build binaries
        run: make -C providers/gke build
