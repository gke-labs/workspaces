# Template rendered with envsubst. Required variables:
#
#   REGION, PROJECT_ID, REPO_NAME, IMAGE_NAME   registry coordinates
#   CPU_IMAGE_TAG, GPU_IMAGE_TAG, TPU_IMAGE_TAG exact image tag per variant
#   GCS_BUCKET                                  shared bucket for notebooks
#
# The image tags are pinned rather than floating on :latest-* so a Workspace restarts
# onto the image it was created with, and so a rebuild cannot change the runtime under
# a running Workspace. build_codeserver_python.sh and deploy_standalone.sh set them for you.
#
# Because the tags are now immutable, imagePullPolicy is IfNotPresent rather than
# Always. Always only earned its keep while these pointed at :latest-*, where the
# contents could change behind a fixed tag. A pinned tag cannot, so Always just adds a
# registry round-trip to every Pod start -- worth avoiding when the GPU image is ~7.5GB
# and the node may already have it. If you ever repoint one of these at a mutable tag,
# put Always back for that entry.
#
# Beware when rendering by hand: envsubst substitutes an unset variable with the empty
# string, which yields `image: ".../codeserver-python:"` and a WorkspaceKind that cannot start
# a Pod. Prefer the scripts, which print the tags they pin.
apiVersion: kubeflow.org/v1beta1
kind: WorkspaceKind
metadata:
  name: codeserver
spec:
  spawner:
    displayName: "VS Code (code-server)"
    description: "A Workspace which runs VS Code (code-server) in a Pod"
    icon:
      url: "https://upload.wikimedia.org/wikipedia/commons/9/9a/Visual_Studio_Code_1.35_icon.svg"
    logo:
      url: "https://upload.wikimedia.org/wikipedia/commons/9/9a/Visual_Studio_Code_1.35_icon.svg"

  filterRules:
    # --------------------------------------------------------------------------
    # IMAGE_CONFIG scope: Filter images based on selected PodConfig accelerator
    # --------------------------------------------------------------------------
    # When a CPU pod is selected, hide GPU and TPU images
    - scope: IMAGE_CONFIG
      effect:
        ui:
          hide: true
        api:
          deny: true
          denyMessage:
            text: "This image requires an accelerator (GPU or TPU) pod, but a CPU pod was selected."
      match:
        - matchPodConfig:
            selector:
              matchLabels:
                accelerator: cpu
        - matchImageConfig:
            selector:
              matchExpressions:
                - key: accelerator
                  operator: NotIn
                  values: ["cpu"]

    # When a GPU pod is selected, hide non-GPU images
    - scope: IMAGE_CONFIG
      effect:
        ui:
          hide: true
        api:
          deny: true
          denyMessage:
            text: "This image is not built for CUDA GPUs; please select a GPU-enabled image."
      match:
        - matchPodConfig:
            selector:
              matchLabels:
                accelerator: gpu
        - matchImageConfig:
            selector:
              matchExpressions:
                - key: accelerator
                  operator: NotIn
                  values: ["gpu"]

    # When a TPU pod is selected, hide non-TPU images
    - scope: IMAGE_CONFIG
      effect:
        ui:
          hide: true
        api:
          deny: true
          denyMessage:
            text: "This image is not built for TPUs (missing libtpu); please select a TPU-enabled image."
      match:
        - matchPodConfig:
            selector:
              matchLabels:
                accelerator: tpu
        - matchImageConfig:
            selector:
              matchExpressions:
                - key: accelerator
                  operator: NotIn
                  values: ["tpu"]

    # --------------------------------------------------------------------------
    # POD_CONFIG scope: Filter podConfigs based on selected ImageConfig accelerator
    # --------------------------------------------------------------------------
    # When a CPU image is selected, hide GPU and TPU pod configs
    - scope: POD_CONFIG
      effect:
        ui:
          hide: true
        api:
          deny: true
          denyMessage:
            text: "A CPU image cannot be scheduled on an accelerator (GPU or TPU) pod."
      match:
        - matchImageConfig:
            selector:
              matchLabels:
                accelerator: cpu
        - matchPodConfig:
            selector:
              matchExpressions:
                - key: accelerator
                  operator: NotIn
                  values: ["cpu"]

    # When a GPU image is selected, hide non-GPU pod configs
    - scope: POD_CONFIG
      effect:
        ui:
          hide: true
        api:
          deny: true
          denyMessage:
            text: "A GPU image requires a GPU pod."
      match:
        - matchImageConfig:
            selector:
              matchLabels:
                accelerator: gpu
        - matchPodConfig:
            selector:
              matchExpressions:
                - key: accelerator
                  operator: NotIn
                  values: ["gpu"]

    # When a TPU image is selected, hide non-TPU pod configs
    - scope: POD_CONFIG
      effect:
        ui:
          hide: true
        api:
          deny: true
          denyMessage:
            text: "A TPU image requires a TPU pod."
      match:
        - matchImageConfig:
            selector:
              matchLabels:
                accelerator: tpu
        - matchPodConfig:
            selector:
              matchExpressions:
                - key: accelerator
                  operator: NotIn
                  values: ["tpu"]

  podTemplate:
    podMetadata:
      labels: {}
      annotations: {}
    serviceAccount:
      clusterRoles:
        - name: "kubeflow-edit"
    volumeMounts:
      home: "/home/jovyan"
    ports:
      - id: "codeserver"
        defaultDisplayName: "VS Code (code-server)"
        protocol: "HTTP"
        httpProxy:
          removePathPrefix: true
          requestHeaders: {}
    extraEnv:
      - name: "LD_LIBRARY_PATH"
        value: "/usr/local/nvidia/lib64"
      - name: "PATH"
        value: "/home/jovyan/.local/bin:/usr/local/nvidia/bin:/usr/local/cuda/bin:/opt/conda/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

      - name: "REGISTRY"
        value: "${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO_NAME}"
      - name: "GCS_BUCKET"
        value: "${GCS_BUCKET}"
    extraVolumeMounts:
      - name: "dshm"
        mountPath: "/dev/shm"
    extraVolumes:
      - name: "dshm"
        emptyDir:
          medium: "Memory"
    securityContext:
      fsGroup: 100
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    options:
      imageConfig:
        spawner:
          default: "codeserver-python-cpu"
        values:
          - id: "codeserver-python-cpu"
            spawner:
              displayName: "codeserver-python (CPU)"
              description: "code-server with Conda Python"
              labels:
                - key: "python_version"
                  value: "3.12"
                - key: "accelerator"
                  value: "cpu"
            spec:
              image: "${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO_NAME}/${IMAGE_NAME}:${CPU_IMAGE_TAG}"
              imagePullPolicy: "IfNotPresent"
              ports:
                - id: "codeserver"
                  port: 8888
          - id: "codeserver-python-gpu"
            spawner:
              displayName: "codeserver-python (GPU)"
              description: "code-server with Conda Python, CUDA, PyTorch, and GPU JAX"
              labels:
                - key: "python_version"
                  value: "3.12"
                - key: "accelerator"
                  value: "gpu"
            spec:
              image: "${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO_NAME}/${IMAGE_NAME}:${GPU_IMAGE_TAG}"
              imagePullPolicy: "IfNotPresent"
              ports:
                - id: "codeserver"
                  port: 8888
          - id: "codeserver-python-tpu"
            spawner:
              displayName: "codeserver-python (TPU)"
              description: "code-server with Conda Python, and TPU JAX (libtpu)"
              labels:
                - key: "python_version"
                  value: "3.12"
                - key: "accelerator"
                  value: "tpu"
            spec:
              image: "${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO_NAME}/${IMAGE_NAME}:${TPU_IMAGE_TAG}"
              imagePullPolicy: "IfNotPresent"
              ports:
                - id: "codeserver"
                  port: 8888
          - id: "codeserver-python:v1.11.0"
            spawner:
              displayName: "codeserver-python:v1.11.0 (Upstream)"
              description: "Upstream Kubeflow code-server with Conda Python"
              labels:
                - key: "python_version"
                  value: "3.12"
                - key: "accelerator"
                  value: "cpu"
            spec:
              image: "ghcr.io/kubeflow/kubeflow/notebook-servers/codeserver-python:v1.11.0"
              imagePullPolicy: "IfNotPresent"
              ports:
                - id: "codeserver"
                  port: 8888
      podConfig:
        spawner:
          default: "small_cpu"
        values:
          - id: "medium_cpu"
            spawner:
              displayName: "Medium CPU"
              description: "Pod with 2 CPU, 4 GB RAM"
              labels:
                - key: "accelerator"
                  value: "cpu"
                - key: "cpu"
                  value: "2"
                - key: "memory"
                  value: "4Gi"
            spec:
              resources:
                requests:
                  cpu: 2
                  memory: 4Gi
          - id: "small_cpu"
            spawner:
              displayName: "Small CPU"
              description: "Pod with 1 CPU, 2 GB RAM"
              labels:
                - key: "accelerator"
                  value: "cpu"
                - key: "cpu"
                  value: "1000m"
                - key: "memory"
                  value: "2Gi"
            spec:
              resources:
                requests:
                  cpu: 1000m
                  memory: 2Gi
          - id: "gpu_best_available"
            spawner:
              displayName: "GPU (best available)"
              description: "Pod with 1 GPU (T4 or L4, Spot first then on-demand), 12 CPU, 40 GB RAM"
              labels:
                - key: "accelerator"
                  value: "gpu"
                - key: "cpu"
                  value: "12"
                - key: "memory"
                  value: "40Gi"
            spec:
              nodeSelector:
                cloud.google.com/compute-class: "gpu-best-available"
              # The gpu-best-available ComputeClass picks the first GPU with capacity (by
              # default T4 Spot -> L4 Spot -> T4 on-demand -> L4 on-demand; edit the class to
              # change GPU types). Sized to fit both n1-standard-16 (T4) and g2-standard-16
              # (L4). The generous memory is not just for the model:
              # GKE copies GPU state through the pod's process memory while taking and
              # restoring a PodSnapshot, so peak pod memory during a pause exceeds what
              # the workload uses at rest.
              resources:
                requests:
                  cpu: 12
                  memory: 40Gi
                limits:
                  cpu: 12
                  memory: 40Gi
                  nvidia.com/gpu: 1
          - id: "tpu_1"
            spawner:
              displayName: "TPU v5 1x1"
              description: "Pod with 1 TPU v5 lite chip"
              labels:
                - key: "accelerator"
                  value: "tpu"
            spec:
              nodeSelector:
                cloud.google.com/compute-class: "tpu-v5-1-single-host"
              resources:
                requests:
                  cpu: 20
                  memory: 40Gi
                limits:
                  google.com/tpu: 1
          - id: "tpu_4"
            spawner:
              displayName: "TPU v5 2x2"
              description: "Pod with 4 TPU v5 lite chips"
              labels:
                - key: "accelerator"
                  value: "tpu"
            spec:
              nodeSelector:
                cloud.google.com/compute-class: "tpu-v5-4-single-host"
              resources:
                requests:
                  cpu: 90
                  memory: 150Gi
                limits:
                  cpu: 90
                  memory: 150Gi
                  google.com/tpu: 4
